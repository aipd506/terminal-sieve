[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-sieve"
version = "0.1.0"
description = "The intelligent terminal output compressor for AI coding agents and LLMs. Shrinks 10,000-token build logs into dense, high-signal diagnostics."
readme = "README.md"
authors = [{ name = "aipd506", email = "aipd506@users.noreply.github.com" }]
license = { text = "MIT" }
keywords = [
    "llm",
    "ai-agent",
    "terminal",
    "compressor",
    "context-window",
    "token-reduction",
    "cursor",
    "claude",
    "mcp",
    "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities"
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0"
]

[project.scripts]
sieve = "terminal_sieve.cli:main"
terminal-sieve = "terminal_sieve.cli:main"

[project.urls]
Homepage = "https://github.com/aipd506/terminal-sieve"
Repository = "https://github.com/aipd506/terminal-sieve"
Issues = "https://github.com/aipd506/terminal-sieve/issues"

[tool.setuptools.packages.find]
where = ["src"]
